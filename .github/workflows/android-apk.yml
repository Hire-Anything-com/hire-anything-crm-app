name: CI/CD — QA (analyze, bump, AAB, publish)

on:
  push:
    branches: ["qa"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-build-publish:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]')) }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.pub-cache/bin
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Flutter analyze
        run: flutter analyze

      - name: Verify required secrets
        run: |
          if [ "${{ secrets.SERVICE_ACCOUNT_JSON }}" = "" ]; then echo "Missing SERVICE_ACCOUNT_JSON" && exit 1; fi
          if [ "${{ secrets.KEYSTORE_BASE64 }}" = "" ]; then echo "Missing KEYSTORE_BASE64" && exit 1; fi
          if [ "${{ secrets.KEYSTORE_PASSWORD }}" = "" ]; then echo "Missing KEYSTORE_PASSWORD" && exit 1; fi
          if [ "${{ secrets.KEY_ALIAS }}" = "" ]; then echo "Missing KEY_ALIAS" && exit 1; fi
          if [ "${{ secrets.KEY_PASSWORD }}" = "" ]; then echo "Missing KEY_PASSWORD" && exit 1; fi
          if [ "${{ secrets.RELEASE_TRACK }}" = "" ]; then echo "Missing RELEASE_TRACK" && exit 1; fi

      - name: Bump patch & build number
        id: bump
        run: |
          set -euo pipefail
          current=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "current version: $current"
          IFS='+' read -r semver build <<< "$current"
          IFS='.' read -r major minor patch <<< "$semver"
          new_patch=$((patch + 1))
          new_build=$((build + 1))
          new_version="${major}.${minor}.${new_patch}+${new_build}"
          echo "Bumping to $new_version"
          sed -i "s/^version: .*/version: ${new_version}/" pubspec.yaml
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore(release): bump version to ${new_version} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:qa
          echo "new_version=${new_version}" >> $GITHUB_OUTPUT

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties

      - name: Accept Android licenses
        run: yes | flutter doctor --android-licenses || true

      - name: Build App Bundle (release)
        run: flutter build appbundle --release

      - name: Install Fastlane
        run: gem install fastlane -NV

      - name: Save service account JSON
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > /tmp/google-play-service-account.json
          chmod 600 /tmp/google-play-service-account.json

      - name: Upload to Google Play using Fastlane
        env:
          SERVICE_ACCOUNT_JSON_PATH: /tmp/google-play-service-account.json
          RELEASE_TRACK: ${{ secrets.RELEASE_TRACK }}
        run: |
          fastlane supply --aab build/app/outputs/bundle/release/app-release.aab --json_key $SERVICE_ACCOUNT_JSON_PATH --package_name com.hireanything.workerapp --track $RELEASE_TRACK
