name: CD — QA branch (bump, build, upload)

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  bump-build-upload:
    if: ${{ github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'qa' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout QA branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            ~/.pub-cache/bin
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Flutter pub get
        run: flutter pub get

      - name: Bump patch & build number
        id: bump
        run: |
          set -euo pipefail
          current=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "current version: $current"
          IFS='+' read -r semver build <<< "$current"
          IFS='.' read -r major minor patch <<< "$semver"
          new_patch=$((patch + 1))
          new_build=$((build + 1))
          new_version="${major}.${minor}.${new_patch}+${new_build}"
          echo "Bumping to $new_version"
          sed -i "s/^version: .*/version: ${new_version}/" pubspec.yaml
          git config user.email "actions@github.com"
          git config user.name "github-actions[bot]"
          git add pubspec.yaml
          git commit -m "chore(release): bump version to ${new_version} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:qa
          echo "new_version=${new_version}" >> $GITHUB_OUTPUT

      - name: Restore keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          chmod 600 android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" > android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "storeFile=app/upload-keystore.jks" >> android/key.properties

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Install Fastlane
        run: gem install fastlane -NV

      - name: Save service account JSON
        run: |
          echo "${{ secrets.SERVICE_ACCOUNT_JSON }}" > /tmp/google-play-service-account.json
          chmod 600 /tmp/google-play-service-account.json

      - name: Upload to Google Play with Fastlane
        env:
          SERVICE_ACCOUNT_JSON_PATH: /tmp/google-play-service-account.json
          RELEASE_TRACK: ${{ secrets.RELEASE_TRACK }}
        run: |
          fastlane supply --aab build/app/outputs/bundle/release/app-release.aab --json_key $SERVICE_ACCOUNT_JSON_PATH --package_name com.hireanything.workerapp --track $RELEASE_TRACK
